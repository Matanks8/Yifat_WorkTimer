<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קודי עבור יפעת - ניהול זמן v1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #db2777; --success: #059669; }
        .progress-pipe { height: 32px; border-radius: 16px; background: #f3f4f6; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ec4899, #db2777); transition: width 0.5s ease; position: absolute; z-index: 5; }
        .progress-planned { height: 100%; background: #fde68a; transition: width 0.5s ease; position: absolute; z-index: 4; opacity: 0.7; }
        .tab-active { background: white !important; shadow: 0 4px 12px rgba(0,0,0,0.1); color: #db2777 !important; }
        input[type="number"] { -moz-appearance: textfield; }
        .modal-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-pink-50 font-sans min-h-screen pb-32 text-slate-900 leading-tight">

    <header class="bg-pink-600 text-white p-6 shadow-2xl rounded-b-[3rem] sticky top-0 z-40">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-pink-50">שלום, יפעת ❤️</h1>
                <p class="text-[10px] opacity-70 font-mono text-left">IFAT EDITION v1.2 | Leave Logic</p>
            </div>
            <div class="flex items-center gap-2 bg-pink-700/50 p-1 rounded-full border border-white/20 text-xs">
                <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center">◀</button>
                <span id="monthDisplay" class="font-bold w-24 text-center"></span>
                <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center">▶</button>
            </div>
        </div>
    </header>

    <nav class="flex p-1.5 bg-pink-100/60 backdrop-blur-md mx-6 -mt-4 rounded-2xl gap-1 shadow-sm relative z-50 max-w-md mx-auto text-sm">
        <button onclick="switchTab('dash')" id="tabDash" class="flex-1 py-2 font-bold rounded-xl text-pink-400 tab-active text-center">מצב נוכחי</button>
        <button onclick="switchTab('cal')" id="tabCal" class="flex-1 py-2 font-bold rounded-xl text-pink-400 text-center">לוח שנה</button>
    </nav>

    <main id="viewDash" class="p-6 space-y-6 max-w-md mx-auto">
        <!-- Dashboard Card -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-pink-50">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <span class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">יתרה לסיום החודש</span>
                    <div class="text-5xl font-black text-pink-600 tracking-tight" id="hoursRemaining">00:00</div>
                </div>
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100 flex flex-col items-end text-left">
                    <span class="text-[9px] text-pink-600 font-bold">יעד שעות</span>
                    <div class="flex items-center gap-1 text-lg font-black" style="direction: ltr;">
                        <input type="number" id="targetH" onchange="saveSettings()" class="w-10 bg-transparent text-center outline-none">
                    </div>
                </div>
            </div>

            <div class="progress-pipe shadow-inner">
                <div id="progressFill" class="progress-fill shadow-lg"></div>
                <div id="plannedFill" class="progress-planned"></div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] font-bold">
                <span id="doneLabel" class="text-emerald-600 font-black"></span>
                <span id="targetLabel" class="text-pink-400"></span>
            </div>
        </div>

        <!-- Smart Prediction Box -->
        <div id="predictionBox" class="bg-white p-5 rounded-[2rem] border border-pink-100 text-xs italic text-pink-900 shadow-sm leading-relaxed">
            מחשב נתונים...
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="toggleCheckIn()" id="checkBtn" class="bg-white p-5 rounded-[2rem] shadow-md border border-pink-50 flex flex-col items-center justify-center relative overflow-hidden transition-all active:scale-95">
                <span id="checkIcon" class="text-3xl mb-1">📍</span>
                <span id="checkText" class="font-bold text-sm text-slate-600">כניסה</span>
                <div id="liveTimer" class="hidden text-[10px] font-mono font-bold text-red-500 mt-1 animate-pulse">00:00:00</div>
            </button>
            <button onclick="openModal()" class="bg-white p-5 rounded-[2rem] shadow-md border border-emerald-50 flex flex-col items-center justify-center transition-all active:scale-95">
                <span class="text-3xl mb-1">📝</span>
                <span class="font-bold text-sm text-slate-600">דיווח ידני</span>
            </button>
        </div>

        <!-- History Log -->
        <div class="space-y-3 pb-10">
            <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-widest px-4">יומן פעילות</h3>
            <div id="logList" class="space-y-2"></div>
        </div>
    </main>

    <main id="viewCal" class="hidden p-6 max-w-md mx-auto text-center py-20 text-slate-300 italic">
        לוח השנה בגרסה זו מתוכנן לעדכון עתידי.
    </main>

    <!-- Entry Modal -->
    <div id="entryModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-[3.5rem] p-8 modal-up shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            
            <div class="space-y-5">
                <!-- Type Selector -->
                <div class="flex gap-2 p-1.5 bg-slate-100 rounded-2xl">
                    <button onclick="setEntryType('עבודה')" id="btnTypeWork" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm text-pink-600 transition-all">עבודה</button>
                    <button onclick="setEntryType('חופשה')" id="btnTypeVac" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-400 transition-all">חופשה/מחלה</button>
                </div>

                <!-- Date -->
                <input type="date" id="entryDate" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 font-bold text-center outline-none focus:ring-2 focus:ring-pink-200">

                <!-- Hours Input -->
                <div class="flex items-center gap-3 justify-center">
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-bold text-slate-400 mb-1 uppercase">דקות</span>
                        <input type="number" id="entryM" placeholder="00" class="bg-slate-50 border border-slate-100 rounded-2xl p-4 w-24 text-center outline-none font-bold text-2xl focus:ring-2 focus:ring-pink-200">
                    </div>
                    <span class="text-3xl font-black text-slate-200 mt-4">:</span>
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-bold text-slate-400 mb-1 uppercase">שעות</span>
                        <input type="number" id="entryH" placeholder="0" class="bg-slate-50 border border-slate-100 rounded-2xl p-4 w-24 text-center outline-none font-bold text-2xl focus:ring-2 focus:ring-pink-200">
                    </div>
                </div>

                <!-- Future Toggle -->
                <div class="flex items-center justify-between p-4 bg-pink-50/50 rounded-2xl border border-pink-100">
                    <span class="text-sm font-bold text-pink-800 tracking-tight">אירוע עתידי (תכנון)</span>
                    <input type="checkbox" id="isPlanned" class="w-6 h-6 accent-pink-600 rounded">
                </div>

                <!-- Footer Buttons -->
                <div class="flex gap-4 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 text-xs">ביטול</button>
                    <button onclick="saveEntry()" class="flex-[2] py-4 bg-pink-600 text-white font-black rounded-[1.5rem] shadow-lg shadow-pink-200 active:scale-95 transition-all">שמור דיווח</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
        let db = JSON.parse(localStorage.getItem('ifat_hours_db')) || { months: {}, checkIn: null, settings: { targetH: 120 } };
        let currentViewDate = new Date();
        let timerInterval;
        let selectedEntryType = 'עבודה';

        function getMonthKey(date) { return `${date.getFullYear()}-${date.getMonth() + 1}`; }

        function renderAll() {
            const data = getCurrentMonthData();
            document.getElementById('monthDisplay').innerText = `${monthNames[currentViewDate.getMonth()]} ${currentViewDate.getFullYear()}`;
            document.getElementById('targetH').value = db.settings.targetH;

            const done = data.logs.filter(l => !l.planned).reduce((s, l) => s + l.mins, 0);
            const planned = data.logs.filter(l => l.planned).reduce((s, l) => s + l.mins, 0);
            const totalTargetMins = db.settings.targetH * 60;
            const remaining = totalTargetMins - done;

            document.getElementById('hoursRemaining').innerText = toHHMM(remaining);
            document.getElementById('doneLabel').innerText = `בוצע: ${toHHMM(done)}`;
            document.getElementById('targetLabel').innerText = `יעד: ${toHHMM(totalTargetMins)}`;
            
            document.getElementById('progressFill').style.width = `${Math.min((done/totalTargetMins)*100, 100)}%`;
            document.getElementById('plannedFill').style.width = `${Math.min(((done+planned)/totalTargetMins)*100, 100)}%`;

            renderLogList(data.logs);
            calculatePrediction(remaining, planned);
            localStorage.setItem('ifat_hours_db', JSON.stringify(db));
        }

        function calculatePrediction(rem, plan) {
            const now = new Date();
            if (getMonthKey(now) !== getMonthKey(currentViewDate)) {
                document.getElementById('predictionBox').innerText = "צפייה בחודש לא פעיל.";
                return;
            }
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const data = getCurrentMonthData();
            let workDaysLeft = 0;

            for (let d = now.getDate(); d <= lastDay; d++) {
                const dateObj = new Date(now.getFullYear(), now.getMonth(), d);
                const day = dateObj.getDay(); // 0=Sun, 4=Thu
                const dateStr = dateObj.toISOString().split('T')[0];

                if (day >= 0 && day <= 4) {
                    // לוגיקה קריטית: האם יש דיווח "חופשה" ליום הזה?
                    const isVacationDay = data.logs.some(l => l.date === dateStr && l.type === 'חופשה');
                    
                    // האם היא כבר עבדה היום (רישום עבודה רגיל ולא מתוכנן)?
                    const workedToday = (d === now.getDate() && data.logs.some(l => l.date === dateStr && !l.planned && l.type === 'עבודה'));

                    if (!isVacationDay && !workedToday) {
                        workDaysLeft++;
                    }
                }
            }
            
            const netRemaining = rem - plan;
            const needed = workDaysLeft > 0 ? netRemaining / workDaysLeft : 0;
            
            document.getElementById('predictionBox').innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-slate-500">ימי עבודה שנותרו:</span>
                    <span class="font-black text-slate-800">${workDaysLeft} ימים</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="font-bold text-slate-500">ממוצע שעות נדרש:</span>
                    <span class="font-black text-pink-600 text-lg">${toHHMM(needed)}</span>
                </div>
                <div class="mt-2 pt-2 border-t border-pink-50 text-[10px] text-pink-400 font-medium">
                    * ימי חופשה/מחלה שמוזנים ביומן אינם נספרים כימי עבודה.
                </div>
            `;
        }

        function setEntryType(t) {
            selectedEntryType = t;
            document.getElementById('btnTypeWork').className = t === 'עבודה' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm text-pink-600 transition-all' : 'flex-1 py-3 rounded-xl font-bold text-sm text-slate-400 transition-all';
            document.getElementById('btnTypeVac').className = t === 'חופשה' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm text-pink-600 transition-all' : 'flex-1 py-3 rounded-xl font-bold text-sm text-slate-400 transition-all';
        }

        function saveEntry() {
            const h = parseInt(document.getElementById('entryH').value) || 0;
            const m = parseInt(document.getElementById('entryM').value) || 0;
            const mins = (h * 60) + m;
            
            // בגרסה 1.2, מאפשרים לשמור חופשה עם 0 דקות כדי לנטרל את היום
            if (mins === 0 && selectedEntryType === 'עבודה') { alert("נא להזין שעות עבודה"); return; }

            getCurrentMonthData().logs.push({
                date: document.getElementById('entryDate').value,
                mins: mins,
                planned: document.getElementById('isPlanned').checked,
                type: selectedEntryType
            });

            closeModal();
            renderAll();
        }

        function toggleCheckIn() {
            const now = Date.now();
            if (!db.checkIn) { db.checkIn = now; startTimer(); } 
            else {
                const mins = Math.round((now - db.checkIn) / 60000);
                if (mins > 0) getCurrentMonthData().logs.push({ date: new Date().toISOString().split('T')[0], mins, planned: false, type: 'עבודה' });
                db.checkIn = null; stopTimer();
            }
            renderAll(); updateCheckInUI();
        }

        function startTimer() {
            document.getElementById('liveTimer').classList.remove('hidden');
            timerInterval = setInterval(() => {
                const diff = Date.now() - db.checkIn;
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('liveTimer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); document.getElementById('liveTimer').classList.add('hidden'); }

        function updateCheckInUI() {
            const btn = document.getElementById('checkBtn');
            if (db.checkIn) {
                document.getElementById('checkIcon').innerText = "⏹️";
                document.getElementById('checkText').innerText = "סיום";
                btn.classList.add('bg-red-50');
                if(!timerInterval) startTimer();
            } else {
                document.getElementById('checkIcon').innerText = "📍";
                document.getElementById('checkText').innerText = "כניסה";
                btn.classList.remove('bg-red-50');
            }
        }

        function renderLogList(logs) {
            const list = document.getElementById('logList');
            list.innerHTML = '';
            [...logs].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((log, i) => {
                const realIdx = logs.indexOf(log);
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-4 bg-white rounded-2xl shadow-sm border border-pink-50 transition-all ${log.type === 'חופשה' ? 'border-r-4 border-r-blue-400' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${log.type === 'חופשה' ? 'bg-blue-50 text-blue-500' : 'bg-pink-50 text-pink-500'}">
                            ${log.type === 'חופשה' ? '🏖️' : '💼'}
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 text-sm">${log.date.split('-').reverse().join('/')}</div>
                            <div class="text-[10px] text-pink-600 font-black">${toHHMM(log.mins)} ${log.planned ? '(מתוכנן)' : ''}</div>
                        </div>
                    </div>
                    <button onclick="deleteLog(${realIdx})" class="text-slate-300 p-2 hover:text-red-400 transition-colors">✕</button>
                `;
                list.appendChild(div);
            });
        }

        function getCurrentMonthData() {
            const key = getMonthKey(currentViewDate);
            if (!db.months[key]) db.months[key] = { logs: [] };
            return db.months[key];
        }

        function toHHMM(mins) {
            const abs = Math.round(Math.abs(mins));
            return `${mins < 0 ? '-' : ''}${Math.floor(abs/60)}:${String(abs%60).padStart(2,'0')}`;
        }

        function saveSettings() { db.settings.targetH = parseInt(document.getElementById('targetH').value) || 0; renderAll(); }
        function switchTab(t) {
            document.getElementById('viewDash').classList.toggle('hidden', t!=='dash');
            document.getElementById('viewCal').classList.toggle('hidden', t!=='cal');
            document.getElementById('tabDash').classList.toggle('tab-active', t==='dash');
            document.getElementById('tabCal').classList.toggle('tab-active', t==='cal');
        }
        function changeMonth(dir) { currentViewDate.setMonth(currentViewDate.getMonth()+dir); renderAll(); }
        function openModal() { document.getElementById('entryModal').classList.remove('hidden'); document.getElementById('entryDate').valueAsDate = new Date(); setEntryType('עבודה'); }
        function closeModal() { document.getElementById('entryModal').classList.add('hidden'); }
        function deleteLog(i) { if(confirm("למחוק את הרישום?")) { getCurrentMonthData().logs.splice(i, 1); renderAll(); } }

        window.onload = () => { updateCheckInUI(); renderAll(); };
    </script>
</body>
</html>
